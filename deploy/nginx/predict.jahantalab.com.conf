# Install as /etc/nginx/sites-available/predict.jahantalab.com and symlink it into sites-enabled
# (same layout as the existing extraction_engine vhost). Then run:
#   certbot --nginx -d predict.jahantalab.com
# which adds the 443 block and the HTTP->HTTPS redirect. Keep the port in sync with APP_PORT.
server {
    listen 80;
    listen [::]:80;
    server_name predict.jahantalab.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:38417;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
