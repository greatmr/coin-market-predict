# Only for the optional API subdomain (deploy/docker-compose.api-subdomain.yml). Install like the
# dashboard vhost, then: certbot --nginx -d api-predict.jahantalab.com
# Keep the port in sync with API_PORT (default 38418).
server {
    listen 80;
    listen [::]:80;
    server_name api-predict.jahantalab.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:38418;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
