# Optional: the API on its own subdomain (e.g. https://api-predict.jahantalab.com) while the dashboard
# stays on https://predict.jahantalab.com. Both are the same site, so the SameSite=Strict session
# cookie keeps working; the API allows the dashboard origin by CORS (with credentials) and the
# dashboard calls the API there. Without this file, the dashboard and /api share one origin.
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.api-subdomain.yml \
#     --env-file .env.prod up -d --build
# .env.prod needs:  DASHBOARD_ORIGIN=https://predict.jahantalab.com
#                   API_ORIGIN=https://api-predict.jahantalab.com
# and host Nginx a vhost for the API host: deploy/nginx/api-predict.jahantalab.com.conf.
services:
  api:
    environment:
      CORS_ORIGINS: ${DASHBOARD_ORIGIN:?set DASHBOARD_ORIGIN in .env.prod}
    ports:
      - "127.0.0.1:${API_PORT:-38418}:3000"
  web:
    environment:
      API_BASE_URL: ${API_ORIGIN:?set API_ORIGIN in .env.prod}
      CSP_CONNECT_SRC: ${API_ORIGIN}
