# Headers for the dashboard's own files (included per location: a location with any add_header
# does not inherit the server's). $dashboard_csp is built in default.conf.template.
add_header Content-Security-Policy $dashboard_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
